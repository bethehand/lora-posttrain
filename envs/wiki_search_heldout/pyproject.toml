[project]
name = "wiki-search-heldout"
version = "0.1.0"
description = "wiki-search with a held-out split by source page"
requires-python = ">=3.11"
# Installed with --no-deps into prime-rl's venv, which already has these at locked versions
dependencies = ["verifiers", "wiki-search", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiki_search_heldout"]
