[project]
name = "factor-idea"
version = "0.1.0"
description = "One-sentence idea -> factor expression, checked in a look-back-only sandbox and scored by incremental rank IC"
requires-python = ">=3.11"
# Installed with --no-deps into prime-rl's venv, which already has these at locked versions
dependencies = ["numpy", "verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factor_idea"]
