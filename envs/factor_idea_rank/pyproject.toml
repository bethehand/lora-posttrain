[project]
name = "factor-idea-rank"
version = "0.1.0"
description = "factor-idea with a training reward that ranks IC among passes on an idea, for prereg/03b-pilot.md"
requires-python = ">=3.11"
# Installed with --no-deps into prime-rl's venv, which already has these at locked versions
dependencies = ["verifiers", "factor-idea"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factor_idea_rank"]
