# wiki-search LoRA RL on 4x RTX 4090. Run with CUDA_VISIBLE_DEVICES=0,1,2:
# GPUs 0-1 serve the policy, GPU 2 trains, GPU 3 stays free for standalone evals.
# Recipe from prime-rl v0.9.0 examples/basic/wiki-search/rl.toml (8 GPUs, batch 512). Changes:
# held-out split by source page, DeepSeek judge, batch 256, local weights, online held-out eval.
# DRAFT: batch_size and max_steps are set from the pilot before the run is pre-registered.

max_steps = 200
seq_len = 4096

[deployment]
num_train_gpus = 1
num_infer_gpus = 2

[model]
# Downloaded from ModelScope and checked against the Hugging Face sha256 of Qwen/Qwen3-4B-Instruct-2507@cdbee75
name = "/mnt/nvme1/bruce/models/Qwen3-4B-Instruct-2507"

[trainer.optim]
lr = 1e-5
weight_decay = 0.0

[trainer.model.lora]
rank = 8
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[orchestrator]
batch_size = 256
group_size = 16

[orchestrator.concurrency]
initial_inflight = 256

[orchestrator.model.lora]

# A local path misses the renderer map's exact-name lookup; without this the default renderer has no tool support
[orchestrator.renderer]
name = "qwen3"

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "wiki-search-train"
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "wiki-search-heldout"
env.taskset.split = "train"
env.taskset.task.judges = [{ id = "wiki-search", model = "deepseek-chat", base_url = "https://api.deepseek.com/v1", api_key_var = "DEEPSEEK_API_KEY" }]
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 50

[[orchestrator.eval.source]]
name = "wiki-search-heldout"
env.taskset.id = "wiki-search-heldout"
env.taskset.split = "heldout"
env.taskset.task.judges = [{ id = "wiki-search", model = "deepseek-chat", base_url = "https://api.deepseek.com/v1", api_key_var = "DEEPSEEK_API_KEY" }]
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[ckpt]

[inference.vllm]
tool_call_parser = "hermes"
