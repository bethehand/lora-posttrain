# Standalone eval against a local vLLM server, e.g. on GPU 3:
#   CUDA_VISIBLE_DEVICES=3 uv run inference --vllm.model $ROOT/models/Qwen3-4B-Instruct-2507 \
#     --vllm.enable-lora --vllm.tool-call-parser hermes
#   uv run eval @ $REPO/configs/wiki-search/eval.toml --env.taskset.split heldout
# Sampling follows the model's generation_config, as in the published eval.

model = "/mnt/nvme1/bruce/models/Qwen3-4B-Instruct-2507"
num_rollouts = 4

[client]
base_url = "http://localhost:8000/v1"

[sampling]
max_tokens = 512

[env.taskset]
id = "wiki-search-heldout"
split = "heldout"

[[env.taskset.task.judges]]
id = "wiki-search"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
api_key_var = "DEEPSEEK_API_KEY"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
